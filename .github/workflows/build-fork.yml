name: Build Flarial DLL (Fork CI)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: Build DLL (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Clean previous builds
        run: |
          if (Test-Path build-x64) { Remove-Item -Recurse -Force build-x64 }
          if (Test-Path build-arm64) { Remove-Item -Recurse -Force build-arm64 }

      - name: Configure CMake (x64)
        run: cmake -G Ninja -S . -B build-x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23

      - name: Build DLL (x64)
        run: ninja -C build-x64 -j $env:NUMBER_OF_PROCESSORS

      - name: Upload x64 DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flarial-x64-Release
          path: |
            build-x64/Flarial.dll
            build-x64/Flarial.pdb
          retention-days: 30

      - name: Upload as Release (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-x64/Flarial.dll
          tag_name: fork-ci-${{ github.sha }}
          name: "Fork CI Build"
          body: "Auto-built from ${{ github.sha }}"
          token: ${{ secrets.GITHUB_TOKEN }}